aid: qrsalt

name: QRSalt

image: https://qrsalt.com/opengraph-image.png?24c24df84fa08fac

description: QRSalt provides QR code and barcode generation services, offering both static free codes and dynamic codes with short links, scan
  analytics, custom domains, and GS1 Digital Link support. The platform includes a free endpoint for rendering QR codes without an API key, as
  well as paid plans for editable, trackable codes, and additional features like QR menus, forms, and bulk generation. Documentation and pricing
  are available on their site, and a bearer key is used for authenticated API access via app.qrsalt.com.

